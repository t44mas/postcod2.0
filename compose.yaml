name: pochta-premium
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pochta
      POSTGRES_DB: pochta_premium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-env.py first}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pochta -d pochta_premium']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pochta:${POSTGRES_PASSWORD}@db:5432/pochta_premium
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 4s
      retries: 20
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
